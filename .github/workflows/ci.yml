name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nihongocore_test
          POSTGRES_PASSWORD: ci_placeholder_only
          POSTGRES_DB: nihongocore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongocore_test -d nihongocore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nihongocore_test:ci_placeholder_only@localhost:5432/nihongocore_test?schema=public
      EXPO_PUBLIC_API_URL: http://localhost:3000/api/v1
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
